[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aippt-generator"
version = "2.0.0"
description = "AI-driven PPT auto-generation system for opencode skill"
readme = "SKILL.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
keywords = ["ppt", "presentation", "ai", "opencode", "skill"]

authors = [
    {name = "Dachang Printing"},
]

dependencies = [
    "python-pptx>=1.0.2",
    "lxml>=5.0",
    "requests>=2.28",
]

[project.optional-dependencies]
assets = ["Pillow>=10.0"]
screenshot = ["pywin32>=306"]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.0",
]
assets-all = ["aippt-generator[assets]"]
all = ["aippt-generator[screenshot,dev,assets]"]

[tool.mypy]
python_version = "3.10"
strict = true
allow_untyped_defs = false
disallow_any_unimported = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
addopts = "-v --tb=short"
